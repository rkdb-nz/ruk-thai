<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Directions to Ruk Thai | Greerton, Tauranga</title>
<meta name="description" content="Find Ruk Thai at 123 Chadwick Road, Greerton, Tauranga.">
<meta name="theme-color" content="#741d2b">
<style>
:root {
  --burgundy: #741d2b;
  --burgundy-dark: #4c111d;
  --gold: #b7934a;
  --cream: #f6efdf;
  --ink: #371a1f;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  min-height: 100dvh;
  color: var(--ink);
  background:
    radial-gradient(circle at 82% 14%, rgba(183,147,74,.14), transparent 28rem),
    var(--cream);
  font-family: Georgia, "Times New Roman", serif;
}
.directions-page {
  width: min(1180px, calc(100% - 32px));
  min-height: 100dvh;
  margin: 0 auto;
  padding: clamp(20px, 4vw, 52px) 0;
  display: grid;
  align-content: center;
  gap: clamp(18px, 3vw, 32px);
}
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}
.logo {
  display: block;
  width: clamp(175px, 22vw, 285px);
}
.logo img {
  display: block;
  width: 100%;
  height: auto;
}
.back {
  color: var(--burgundy);
  font: 700 .78rem/1.1 Arial, sans-serif;
  letter-spacing: .1em;
  text-decoration: none;
  text-transform: uppercase;
}
.back:hover, .back:focus-visible { text-decoration: underline; }
.map-card {
  overflow: hidden;
  display: grid;
  grid-template-columns: minmax(270px, .72fr) minmax(420px, 1.55fr);
  min-height: min(650px, 68dvh);
  border: 1px solid rgba(183,147,74,.8);
  background: #fffaf0;
  box-shadow: 0 18px 55px rgba(76,17,29,.18);
  clip-path: polygon(18px 0, calc(100% - 18px) 0, 100% 18px, 100% calc(100% - 18px), calc(100% - 18px) 100%, 18px 100%, 0 calc(100% - 18px), 0 18px);
}
.details {
  position: relative;
  z-index: 1;
  padding: clamp(30px, 5vw, 64px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  color: #fffaf0;
  background:
    linear-gradient(rgba(116,29,43,.96), rgba(76,17,29,.98)),
    repeating-linear-gradient(45deg, transparent 0 8px, rgba(255,255,255,.025) 8px 9px);
}
.eyebrow {
  margin: 0 0 16px;
  color: #e4c986;
  font: 700 .75rem/1.2 Arial, sans-serif;
  letter-spacing: .18em;
  text-transform: uppercase;
}
h1 {
  margin: 0;
  font-size: clamp(2.25rem, 5vw, 4.6rem);
  font-weight: 400;
  line-height: .95;
}
address {
  margin: 24px 0 0;
  font-style: normal;
  font-size: clamp(1.05rem, 1.7vw, 1.35rem);
  line-height: 1.55;
}
.phone {
  display: inline-block;
  margin-top: 8px;
  color: #fffaf0;
  font-weight: 700;
  text-decoration-color: var(--gold);
  text-underline-offset: 4px;
}
.actions {
  margin-top: 32px;
  display: grid;
  gap: 12px;
}
.button {
  min-height: 52px;
  padding: 14px 18px;
  display: grid;
  place-items: center;
  border: 1px solid #d7b866;
  color: var(--burgundy-dark);
  background: #f7e8b8;
  box-shadow: 0 6px 0 rgba(42,7,13,.35);
  font: 800 .78rem/1 Arial, sans-serif;
  letter-spacing: .08em;
  text-align: center;
  text-decoration: none;
  text-transform: uppercase;
  clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px);
}
.button.secondary {
  border-color: rgba(255,250,240,.65);
  color: #fffaf0;
  background: transparent;
  box-shadow: none;
}
.button:hover, .button:focus-visible { filter: brightness(1.06); transform: translateY(-1px); }
.map {
  min-height: 420px;
  background: #e8e2d7;
}
.map iframe {
  display: block;
  width: 100%;
  height: 100%;
  min-height: 420px;
  border: 0;
}
.map-note {
  margin: 0;
  padding: 10px 18px;
  color: #6b5054;
  background: #fffaf0;
  font: .76rem/1.4 Arial, sans-serif;
  text-align: center;
}
@media (max-width: 760px) {
  .directions-page {
    width: min(100% - 20px, 560px);
    padding: 16px 0 20px;
    align-content: start;
  }
  .topbar { padding: 0 4px; }
  .logo { width: 170px; }
  .map-card {
    min-height: 0;
    grid-template-columns: 1fr;
  }
  .details { padding: 28px 24px 30px; }
  h1 { font-size: clamp(2.4rem, 13vw, 3.5rem); }
  address { margin-top: 18px; }
  .actions { margin-top: 24px; }
  .map { min-height: 43dvh; }
  .map iframe { min-height: 43dvh; }
}
@media (max-height: 500px) and (orientation: landscape) {
  .directions-page { width: min(1100px, calc(100% - 24px)); padding: 12px 0; gap: 10px; }
  .logo { width: 145px; }
  .map-card { min-height: 360px; grid-template-columns: .8fr 1.5fr; }
  .details { padding: 22px 28px; }
  h1 { font-size: 2.6rem; }
  address { margin-top: 12px; font-size: 1rem; line-height: 1.35; }
  .actions { margin-top: 16px; grid-template-columns: 1fr 1fr; }
  .button { min-height: 44px; padding: 10px 12px; }
  .map, .map iframe { min-height: 360px; }
}
</style>
</head>
<body>
<main class="directions-page">
  <header class="topbar">
    <a class="logo" href="index.html" aria-label="Ruk Thai home">
      <img src="assets/brand/ruk-thai-logo-banner.png" alt="Ruk Thai">
    </a>
    <a class="back" href="index.html">← Back to Ruk Thai</a>
  </header>

  <section class="map-card" aria-labelledby="directions-title">
    <div class="details">
      <p class="eyebrow">Greerton · Tauranga</p>
      <h1 id="directions-title">Find us</h1>
      <address>
        123 Chadwick Road<br>
        Greerton, Tauranga 3112<br>
        <a class="phone" href="tel:+6475796180">07 579 6180</a>
      </address>
      <div class="actions">
        <a class="button" href="https://www.google.com/maps/dir/?api=1&amp;destination=123+Chadwick+Road+Greerton+Tauranga+3112" target="_blank" rel="noopener">Open in Google Maps</a>
        <a class="button secondary" href="index.html">Back to Ruk Thai</a>
      </div>
    </div>

    <div class="map">
      <iframe
        title="Map showing Ruk Thai at 123 Chadwick Road, Greerton, Tauranga"
        src="https://www.google.com/maps?q=Ruk+Thai,+123+Chadwick+Road,+Greerton,+Tauranga+3112&amp;output=embed"
        loading="eager"
        referrerpolicy="no-referrer-when-downgrade"
        allowfullscreen>
      </iframe>
    </div>
  </section>
</main>
</body>
</html>
