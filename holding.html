<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#541a24">
<title>Private Preview | Ruk Thai</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top,#793342 0,#37141d 67%,#210e14 100%);color:#fff4e7;font:18px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{width:min(100%,420px);text-align:center;padding:clamp(28px,7vw,44px);background:#28121bea;border:1px solid #a98165;border-radius:20px;box-shadow:0 20px 70px #150409aa}
small{letter-spacing:.22em;text-transform:uppercase;color:#e8c493;font-weight:700}
h1{font-family:Georgia,serif;font-size:clamp(34px,7vw,48px);line-height:1.1;margin:15px 0 20px}
p{margin:0 0 24px;color:#f7dec7}
label{display:block;text-align:left;font-weight:650;margin-bottom:8px}
input{width:100%;border:2px solid #e3be9e;border-radius:9px;padding:13px 14px;background:#fff;color:#22131a;font:inherit}
input:focus-visible,button:focus-visible{outline:3px solid #f7d36d;outline-offset:3px}
button{width:100%;border:0;border-radius:9px;background:#efc98e;color:#25121a;font:700 19px system-ui;padding:14px;margin-top:15px;cursor:pointer}
#error{color:#ffbbb5;min-height:1.5em;margin-top:18px;font-weight:650}
</style>
</head>
<body><main>
<small>Private preview</small><h1>Ruk Thai</h1>
<p>This website is currently unavailable to the public.</p>
<form method="post" action="/_ruk_unlock">
<label for="pass">Preview password</label>
<input id="pass" type="password" name="password" required autocomplete="current-password" autofocus>
<button type="submit">Enter website</button>
</form>
<p id="error" role="alert"></p>
</main>
<script>if(new URLSearchParams(location.search).has("incorrect"))document.getElementById("error").textContent="Incorrect password. Please try again.";</script>
</body></html>
