<style>
#ruk-private-shield{position:fixed;inset:0;z-index:2147483646;background:rgba(23,10,13,.13);display:flex;justify-content:center;align-items:flex-start;padding:clamp(18px,4vh,40px) 12px 20px;overflow:auto;font-family:system-ui,-apple-system,Segoe UI,sans-serif;box-sizing:border-box}
#ruk-private-shield *{box-sizing:border-box}
#ruk-private-pills{display:grid;gap:12px;width:min(100%,470px);filter:drop-shadow(0 5px 20px rgba(30,4,11,.55))}
#ruk-private-message,#ruk-private-form{background:#fff;color:#41202b;border-radius:999px;border:1px solid rgba(126,79,83,.22);box-shadow:0 7px 24px rgba(0,0,0,.23);min-height:50px}
#ruk-private-message{text-align:center;padding:15px 20px;font-size:clamp(14px,3.3vw,17px);line-height:1.4}
#ruk-private-message a{font-weight:750;color:#862c45;text-decoration:underline;text-underline-offset:3px}
#ruk-private-form{display:flex;align-items:center;gap:9px;padding:7px 8px 7px 20px}
#ruk-private-form label{font-size:15px;white-space:nowrap;font-weight:700}
#ruk-private-form input{min-width:0;width:100%;flex:1;border:0;border-bottom:1px solid #ba9b9f;border-radius:0;background:#fff;color:#26141a;font-size:16px;padding:8px 3px;outline-offset:2px}
#ruk-private-form button{border:0;background:#74303f;color:#fff;border-radius:999px;min-height:36px;min-width:44px;padding:8px 13px;font-size:21px;cursor:pointer}
#ruk-private-form button:focus-visible,#ruk-private-message a:focus-visible,#ruk-private-form input:focus-visible{outline:3px solid #df9a36;outline-offset:3px}
#ruk-private-error{background:#fff;color:#9d192d;text-align:center;border-radius:16px;padding:9px;font-size:15px;font-weight:650;margin:0}
@media(max-width:340px){#ruk-private-form{padding-left:12px;gap:5px}#ruk-private-form label{font-size:13px}#ruk-private-form button{min-width:37px;padding:7px}}
</style>
<div id="ruk-private-shield"><section id="ruk-private-pills" aria-label="Private site access">
<div id="ruk-private-message">This website is currently private. <a href="mailto:robert@rkdb.nz?subject=Ruk%20Thai%20Website%20Access%20Request">Request access</a></div>
<form id="ruk-private-form" action="/_ruk_unlock" method="post">
<label for="ruk-access-code">Access code:</label>
<input id="ruk-access-code" name="password" type="password" required autocomplete="current-password" aria-label="Access code">
<button type="submit" aria-label="Unlock website">➜</button></form>
<p id="ruk-private-error" role="alert" hidden>Incorrect access code. Please try again.</p>
</section></div>
<script>if(new URLSearchParams(location.search).has("incorrect"))document.getElementById("ruk-private-error").hidden=false;</script>
